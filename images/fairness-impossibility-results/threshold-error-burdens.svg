<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1270" viewBox="0 0 1100 1270" role="img" aria-labelledby="title desc">
<title id="title">Calibrated scores, unequal error rates</title>
<desc id="desc">Invented groups of 1000. A has base rate 40%, 100 false positives and 200 false negatives. B has base rate 60%, 200 false positives and 100 false negatives. Each bin is exactly calibrated. Rates use all observed negatives or positives, not the size of a score bin.</desc>
<style>text{font-family:Arial,sans-serif;fill:#20252b;font-size:23px} .heading{font-size:30px;font-weight:700} .small{font-size:21px} .axis{stroke:#707a82;stroke-width:1.5} .grid{stroke:#e2e6e9;stroke-width:1} .muted{fill:#525d67}</style>
<rect width="1100" height="1270" fill="#f6f8f8"/>
<text x="40" y="57" style="font-size:38px;font-weight:700">Calibrated scores, unequal error rates</text>
<text x="40" y="96" class="small muted">Invented data: 1,000 people per group. Positive classification at score &gt;= 0.5.</text>
<rect x="40" y="114" width="24" height="24" fill="#cedae4" />
<text x="75" y="133" class="small">No outcome: true negative</text>
<rect x="575" y="114" width="24" height="24" fill="#dda099" />
<text x="610" y="133" class="small">Outcome: true positive</text>
<rect x="40" y="154" width="24" height="24" fill="#7958a2" />
<text x="75" y="173" class="small">Outcome below cutoff: false negative</text>
<rect x="575" y="154" width="24" height="24" fill="#db9a24" />
<text x="610" y="173" class="small">No outcome above cutoff: false positive</text>
<rect x="28" y="210" width="1044" height="400" fill="#ffffff" stroke="#cbd3d8" rx="6"/>
<text x="48" y="252" class="heading">Group A</text>
<text x="215" y="252" >Base rate: 400 / 1000 = 40%</text>
<text x="79" y="290" class="small muted">People per score</text>
<line class="grid" x1="88" y1="524.0" x2="620" y2="524.0"/>
<text x="76" y="531.0" class="small muted" text-anchor="end">0</text>
<line class="grid" x1="88" y1="474.0" x2="620" y2="474.0"/>
<text x="76" y="481.0" class="small muted" text-anchor="end">100</text>
<line class="grid" x1="88" y1="424.0" x2="620" y2="424.0"/>
<text x="76" y="431.0" class="small muted" text-anchor="end">200</text>
<line class="grid" x1="88" y1="374.0" x2="620" y2="374.0"/>
<text x="76" y="381.0" class="small muted" text-anchor="end">300</text>
<line class="grid" x1="88" y1="324.0" x2="620" y2="324.0"/>
<text x="76" y="331.0" class="small muted" text-anchor="end">400</text>
<rect x="112" y="364.0" width="90" height="160.0" fill="#cedae4" />
<rect x="112" y="324.0" width="90" height="40.0" fill="#7958a2" />
<text x="157.0" y="314.0" class="small" text-anchor="middle">400</text>
<text x="157.0" y="555" text-anchor="middle">0.2</text>
<rect x="239" y="434.0" width="90" height="90.0" fill="#cedae4" />
<rect x="239" y="374.0" width="90" height="60.0" fill="#7958a2" />
<text x="284.0" y="364.0" class="small" text-anchor="middle">300</text>
<text x="284.0" y="555" text-anchor="middle">0.4</text>
<rect x="366" y="484.0" width="90" height="40.0" fill="#db9a24" />
<rect x="366" y="424.0" width="90" height="60.0" fill="#dda099" />
<text x="411.0" y="414.0" class="small" text-anchor="middle">200</text>
<text x="411.0" y="555" text-anchor="middle">0.6</text>
<rect x="493" y="514.0" width="90" height="10.0" fill="#db9a24" />
<rect x="493" y="474.0" width="90" height="40.0" fill="#dda099" />
<text x="538.0" y="464.0" class="small" text-anchor="middle">100</text>
<text x="538.0" y="555" text-anchor="middle">0.8</text>
<line x1="347" y1="303" x2="347" y2="524" stroke="#20252b" stroke-width="3" stroke-dasharray="8 6"/>
<text x="347" y="291" class="small" text-anchor="middle">0.5 cutoff</text>
<text x="92" y="588" class="small muted">Classify negative</text>
<text x="382" y="588" class="small muted">Classify positive</text>
<text x="675" y="295" style="font-weight:700">Error counts</text>
<text x="675" y="324" class="small muted">Same scale in both panels</text>
<text x="675" y="363" class="small">False negatives</text>
<rect x="675" y="373" width="200" height="24" fill="#7958a2" />
<text x="890" y="394" class="small">200</text>
<text x="675" y="441" class="small">False positives</text>
<rect x="675" y="451" width="100" height="24" fill="#db9a24" />
<text x="790" y="472" class="small">100</text>
<text x="675" y="532" class="small">FPR = 100 / 600 = 16.7%</text>
<text x="675" y="570" class="small">FNR = 200 / 400 = 50.0%</text>
<rect x="28" y="630" width="1044" height="400" fill="#ffffff" stroke="#cbd3d8" rx="6"/>
<text x="48" y="672" class="heading">Group B</text>
<text x="215" y="672" >Base rate: 600 / 1000 = 60%</text>
<text x="79" y="710" class="small muted">People per score</text>
<line class="grid" x1="88" y1="944.0" x2="620" y2="944.0"/>
<text x="76" y="951.0" class="small muted" text-anchor="end">0</text>
<line class="grid" x1="88" y1="894.0" x2="620" y2="894.0"/>
<text x="76" y="901.0" class="small muted" text-anchor="end">100</text>
<line class="grid" x1="88" y1="844.0" x2="620" y2="844.0"/>
<text x="76" y="851.0" class="small muted" text-anchor="end">200</text>
<line class="grid" x1="88" y1="794.0" x2="620" y2="794.0"/>
<text x="76" y="801.0" class="small muted" text-anchor="end">300</text>
<line class="grid" x1="88" y1="744.0" x2="620" y2="744.0"/>
<text x="76" y="751.0" class="small muted" text-anchor="end">400</text>
<rect x="112" y="904.0" width="90" height="40.0" fill="#cedae4" />
<rect x="112" y="894.0" width="90" height="10.0" fill="#7958a2" />
<text x="157.0" y="884.0" class="small" text-anchor="middle">100</text>
<text x="157.0" y="975" text-anchor="middle">0.2</text>
<rect x="239" y="884.0" width="90" height="60.0" fill="#cedae4" />
<rect x="239" y="844.0" width="90" height="40.0" fill="#7958a2" />
<text x="284.0" y="834.0" class="small" text-anchor="middle">200</text>
<text x="284.0" y="975" text-anchor="middle">0.4</text>
<rect x="366" y="884.0" width="90" height="60.0" fill="#db9a24" />
<rect x="366" y="794.0" width="90" height="90.0" fill="#dda099" />
<text x="411.0" y="784.0" class="small" text-anchor="middle">300</text>
<text x="411.0" y="975" text-anchor="middle">0.6</text>
<rect x="493" y="904.0" width="90" height="40.0" fill="#db9a24" />
<rect x="493" y="744.0" width="90" height="160.0" fill="#dda099" />
<text x="538.0" y="734.0" class="small" text-anchor="middle">400</text>
<text x="538.0" y="975" text-anchor="middle">0.8</text>
<line x1="347" y1="723" x2="347" y2="944" stroke="#20252b" stroke-width="3" stroke-dasharray="8 6"/>
<text x="347" y="711" class="small" text-anchor="middle">0.5 cutoff</text>
<text x="92" y="1008" class="small muted">Classify negative</text>
<text x="382" y="1008" class="small muted">Classify positive</text>
<text x="675" y="715" style="font-weight:700">Error counts</text>
<text x="675" y="744" class="small muted">Same scale in both panels</text>
<text x="675" y="783" class="small">False negatives</text>
<rect x="675" y="793" width="100" height="24" fill="#7958a2" />
<text x="790" y="814" class="small">100</text>
<text x="675" y="861" class="small">False positives</text>
<rect x="675" y="871" width="200" height="24" fill="#db9a24" />
<text x="890" y="892" class="small">200</text>
<text x="675" y="952" class="small">FPR = 200 / 400 = 50.0%</text>
<text x="675" y="990" class="small">FNR = 100 / 600 = 16.7%</text>
<text x="40" y="1089" style="font-weight:700">Same within-score proportions; different numbers at each score.</text>
<text x="40" y="1126" class="small">At 0.2, 20% have the outcome in each group; at 0.8, 80% do.</text>
<text x="40" y="1163" class="small">FPR divides by all observed negatives. FNR divides by all observed positives.</text>
<text x="40" y="1200" class="small">Both groups have 300 errors, but their error types and rates differ.</text>
<text x="40" y="1237" class="small muted">This direction is illustrative, not forced by calibration. Full counts are in the page table.</text>
</svg>
